name: Update news and launches

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the busy :00/:30 marks where GitHub delays or drops scheduled runs
  workflow_dispatch:          # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch feeds and launch data
        run: python scripts/update_data.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/launches.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update news and launches"
            git push
          fi
